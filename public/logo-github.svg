  <!-- Shield background -->
  <path d="M32 12 L47 17 L47 29 C47 37 32 45 32 45 C32 45 17 37 17 29 L17 17 L32 12 Z" fill="#22c55e" stroke="none"/>
  
  <!-- Receipt/document lines inside shield -->
