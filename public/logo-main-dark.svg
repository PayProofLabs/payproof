<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Logo with Icon and Text - Dark Mode -->
  
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Shield background -->
    <path d="M20 5 L35 10 L35 22 C35 30 20 38 20 38 C20 38 5 30 5 22 L5 10 L20 5 Z" fill="#22c55e" stroke="none"/>
    
    <!-- Receipt/document lines inside shield -->
    <rect x="12" y="14" width="16" height="1.5" fill="white" opacity="0.9"/>
    <rect x="12" y="17" width="12" height="1.5" fill="white" opacity="0.7"/>
    <rect x="12" y="20" width="14" height="1.5" fill="white" opacity="0.7"/>
    
    <!-- Checkmark -->
    <path d="M15 24 L18 27 L25 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Subtle Stellar-inspired star element -->
    <circle cx="30" cy="15" r="2" fill="#22c55e" opacity="0.6"/>
    <path d="M30 13 L30.8 14.2 L32 14.2 L31.1 15 L31.4 16.2 L30 15.6 L28.6 16.2 L28.9 15 L28 14.2 L29.2 14.2 Z" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(60, 15)">
    <text x="0" y="20" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
      PayProof
    </text>
    <text x="0" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="400" fill="#9ca3af" letter-spacing="0.1em">
      STELLAR VERIFICATION
    </text>
  </g>
</svg>